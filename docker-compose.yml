# Published ports bind to loopback by default: with a reverse proxy in front
# (deploy/nginx or deploy/caddy) nothing else has any business being reachable
# from outside the host. Set PUBLISH_HOST=0.0.0.0 to expose them on the LAN.
x-flow-env: &flow-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flowmeta}:${POSTGRES_PASSWORD:-flowmeta}@postgres:5432/${POSTGRES_DB:-flowmeta}
  REDIS_URL: redis://redis:6379/0
  FERNET_KEY: ${FERNET_KEY:?Set FERNET_KEY in .env}
  FLOWMETA_TOKEN_SECRET: ${FLOWMETA_TOKEN_SECRET:?Set FLOWMETA_TOKEN_SECRET in .env}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
  CLIP_UPLOAD_DIR: ${CLIP_UPLOAD_DIR:-/app/uploads/clips}
  CLIP_MAX_UPLOAD_BYTES: ${CLIP_MAX_UPLOAD_BYTES:-4294967296}
  CLIP_RETENTION_ENABLED: ${CLIP_RETENTION_ENABLED:-true}
  CLIP_SESSION_GRACE_SECONDS: ${CLIP_SESSION_GRACE_SECONDS:-86400}
  CLIP_SWEEP_INTERVAL_SECONDS: ${CLIP_SWEEP_INTERVAL_SECONDS:-60}
  CLIP_CANCEL_POLL_SECONDS: ${CLIP_CANCEL_POLL_SECONDS:-10}
  ASR_BACKEND: ${ASR_BACKEND:-local}
  ASR_WHISPER_MODEL: ${ASR_WHISPER_MODEL:-small}
  ASR_COMPUTE_TYPE: ${ASR_COMPUTE_TYPE:-int8}
  ASR_CPU_THREADS: ${ASR_CPU_THREADS:-8}
  ASR_BEAM_SIZE: ${ASR_BEAM_SIZE:-1}
  SCORING_BACKEND: ${SCORING_BACKEND:-gemini}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
  GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-8192}
  GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-minimal}
  LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
  LLM_RETRY_BASE_SECONDS: ${LLM_RETRY_BASE_SECONDS:-0.75}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
  TTS_BACKEND: ${TTS_BACKEND:-edge}
  TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-vi-female}
  TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-30}
  TTS_MAX_RETRIES: ${TTS_MAX_RETRIES:-1}
  TTS_RETRY_BASE_SECONDS: ${TTS_RETRY_BASE_SECONDS:-0.5}
  TTS_MAX_TEMPO: ${TTS_MAX_TEMPO:-1.6}
  PEXELS_API_KEY: ${PEXELS_API_KEY:-}
  STOCK_TIMEOUT_SECONDS: ${STOCK_TIMEOUT_SECONDS:-20}
  GEN_SCENE_PAD_SEC: ${GEN_SCENE_PAD_SEC:-0.4}
  GEN_MAX_DURATION_SEC: ${GEN_MAX_DURATION_SEC:-120}
  GEN_MAX_UPLOAD_IMAGES: ${GEN_MAX_UPLOAD_IMAGES:-12}
  GEN_MAX_IMAGE_BYTES: ${GEN_MAX_IMAGE_BYTES:-15728640}
  FLOW_BASE_URL: http://flow:8001
  FACE_BASE_URL: http://backend:8000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowmeta}
      POSTGRES_USER: ${POSTGRES_USER:-flowmeta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowmeta}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowmeta} -d ${POSTGRES_DB:-flowmeta}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flowmeta}:${POSTGRES_PASSWORD:-flowmeta}@postgres:5432/${POSTGRES_DB:-flowmeta}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flowmeta}:${POSTGRES_PASSWORD:-flowmeta}@postgres:5432/${POSTGRES_DB:-flowmeta}
      REDIS_URL: redis://redis:6379/0
      FERNET_KEY: ${FERNET_KEY:?Set FERNET_KEY in .env}
      FLOWMETA_TOKEN_SECRET: ${FLOWMETA_TOKEN_SECRET:?Set FLOWMETA_TOKEN_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      AUTO_EXCHANGE_LONG_LIVED_TOKEN: ${AUTO_EXCHANGE_LONG_LIVED_TOKEN:-true}
      TOKEN_REFRESH_THRESHOLD_DAYS: ${TOKEN_REFRESH_THRESHOLD_DAYS:-14}
      FACEBOOK_OAUTH_REDIRECT_URI: ${FACEBOOK_OAUTH_REDIRECT_URI:-http://localhost:${BACKEND_PORT:-8000}/api/facebook/oauth/callback}
      FACEBOOK_OAUTH_SCOPES: ${FACEBOOK_OAUTH_SCOPES:-pages_show_list,pages_read_engagement,pages_manage_posts}
      FACEBOOK_OAUTH_SUCCESS_URL: ${FACEBOOK_OAUTH_SUCCESS_URL:-http://localhost:${FRONTEND_PORT:-3000}/accounts}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_REDIRECT_URI: ${AUTH_GOOGLE_REDIRECT_URI:-http://localhost:${BACKEND_PORT:-8000}/api/auth/oauth/google/callback}
      AUTH_FACEBOOK_APP_ID: ${AUTH_FACEBOOK_APP_ID:-}
      AUTH_FACEBOOK_APP_SECRET: ${AUTH_FACEBOOK_APP_SECRET:-}
      AUTH_FACEBOOK_REDIRECT_URI: ${AUTH_FACEBOOK_REDIRECT_URI:-http://localhost:${BACKEND_PORT:-8000}/api/auth/oauth/facebook/callback}
      AUTH_FRONTEND_CALLBACK_URL: ${AUTH_FRONTEND_CALLBACK_URL:-http://localhost:${FRONTEND_PORT:-3000}/auth/callback}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-http://localhost:${FRONTEND_PORT:-3000}/reset-password}
      EXPOSE_PASSWORD_RESET_TOKEN: ${EXPOSE_PASSWORD_RESET_TOKEN:-false}
      BROWSER_PROFILE_DIR: ${BROWSER_PROFILE_DIR:-/app/browser-profiles}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      COMMENT_IMAGE_MAX_BYTES: ${COMMENT_IMAGE_MAX_BYTES:-10485760}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
      BROWSER_PROVIDER: ${BROWSER_PROVIDER:-kasm}
      BROWSERLESS_WS_URL: ${BROWSERLESS_WS_URL:-ws://browserless:3000/chromium}
      BROWSER_SESSION_TTL_SECONDS: ${BROWSER_SESSION_TTL_SECONDS:-1800}
      MAX_BROWSER_SESSIONS_PER_USER: ${MAX_BROWSER_SESSIONS_PER_USER:-1}
      MAX_BROWSER_SESSIONS_GLOBAL: ${MAX_BROWSER_SESSIONS_GLOBAL:-10}
      REMOTE_BROWSER_PUBLIC_BASE_URL: ${REMOTE_BROWSER_PUBLIC_BASE_URL:-http://localhost:${BACKEND_PORT:-8000}}
      KASM_IMAGE: ${KASM_IMAGE:-kasmweb/chrome:1.19.0}
      KASM_DOCKER_NETWORK: ${KASM_DOCKER_NETWORK:-comment_edit_delete_default}
      KASM_BROWSER_PROFILES_VOLUME: ${KASM_BROWSER_PROFILES_VOLUME:-comment_edit_delete_browser-profiles}
      KASM_PUBLIC_SCHEME: ${KASM_PUBLIC_SCHEME:-https}
      KASM_PUBLIC_HOST: ${KASM_PUBLIC_HOST:-localhost}
      KASM_VNC_PASSWORD: ${KASM_VNC_PASSWORD:?Set KASM_VNC_PASSWORD in .env}
      KASM_EMBED_CREDENTIALS_IN_URL: ${KASM_EMBED_CREDENTIALS_IN_URL:-true}
      REMOTE_BROWSER_BASE_URL: ${REMOTE_BROWSER_BASE_URL:-http://localhost:${REMOTE_BROWSER_PORT:-3010}}
      REMOTE_BROWSER_URL_TEMPLATE: ${REMOTE_BROWSER_URL_TEMPLATE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-logs:/app/logs
      - backend-uploads:/app/uploads
      - browser-profiles:/app/browser-profiles
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flowmeta}:${POSTGRES_PASSWORD:-flowmeta}@postgres:5432/${POSTGRES_DB:-flowmeta}
      REDIS_URL: redis://redis:6379/0
      FERNET_KEY: ${FERNET_KEY:?Set FERNET_KEY in .env}
      FLOWMETA_TOKEN_SECRET: ${FLOWMETA_TOKEN_SECRET:?Set FLOWMETA_TOKEN_SECRET in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads
    restart: unless-stopped

  # Flow Studio API — separate process, separate port, same Postgres/Redis.
  # The port binds to loopback for local development; behind the reverse proxy
  # the browser reaches it as /flow/* on the public origin, never directly.
  flow:
    build:
      context: ./backend
    command:
      - uvicorn
      - app.flow_app:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    environment:
      <<: *flow-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${FLOW_PORT:-8001}:8001"
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Runs the clip pipeline (ffmpeg + faster-whisper + scoring) and the
  # retention sweeper that deletes a job's files once its tab stops beating.
  flow-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.flow_worker"]
    environment:
      <<: *flow-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend-uploads:/app/uploads
      - backend-logs:/app/logs
      # Keeps the downloaded Whisper weights across restarts.
      - flow-models:/root/.cache
    restart: unless-stopped

  browser-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.browser
    command: ["python", "-m", "app.browser_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-flowmeta}:${POSTGRES_PASSWORD:-flowmeta}@postgres:5432/${POSTGRES_DB:-flowmeta}
      REDIS_URL: redis://redis:6379/0
      FERNET_KEY: ${FERNET_KEY:?Set FERNET_KEY in .env}
      FLOWMETA_TOKEN_SECRET: ${FLOWMETA_TOKEN_SECRET:?Set FLOWMETA_TOKEN_SECRET in .env}
      BROWSER_PROFILE_DIR: ${BROWSER_PROFILE_DIR:-/app/browser-profiles}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      BROWSER_WORKER_CONCURRENCY: ${BROWSER_WORKER_CONCURRENCY:-1}
      BROWSERLESS_WS_URL: ${BROWSERLESS_WS_URL:-ws://browserless:3000/chromium}
      REMOTE_BROWSER_BASE_URL: ${REMOTE_BROWSER_BASE_URL:-http://localhost:${REMOTE_BROWSER_PORT:-3010}}
      REMOTE_BROWSER_URL_TEMPLATE: ${REMOTE_BROWSER_URL_TEMPLATE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      browserless:
        condition: service_started
    volumes:
      - backend-uploads:/app/uploads
      - browser-profiles:/app/browser-profiles
    restart: unless-stopped

  browserless:
    image: ghcr.io/browserless/chromium:latest
    user: root
    environment:
      CONCURRENT: ${BROWSERLESS_CONCURRENT:-5}
      TIMEOUT: ${BROWSERLESS_TIMEOUT:-300000}
      DATA_DIR: /app/browser-profiles
    volumes:
      - browser-profiles:/app/browser-profiles
    expose:
      - "3000"
    shm_size: "1gb"
    restart: unless-stopped

  remote-browser:
    profiles: ["dev-browser"]
    build:
      context: ./backend
      dockerfile: Dockerfile.remote-browser
    environment:
      REMOTE_BROWSER_PROFILE_DIR: /browser-profiles/shared
      SCREEN_RESOLUTION: ${REMOTE_BROWSER_SCREEN:-1440x900x24}
    volumes:
      - browser-profiles:/browser-profiles
    ports:
      - "${REMOTE_BROWSER_PORT:-3010}:6080"
    shm_size: "1gb"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${LOCAL_NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-8000}}
        NEXT_PUBLIC_FLOW_API_URL: ${LOCAL_NEXT_PUBLIC_FLOW_API_URL:-http://localhost:${FLOW_PORT:-8001}}
    environment:
      NEXT_PUBLIC_API_URL: ${LOCAL_NEXT_PUBLIC_API_URL:-http://localhost:${BACKEND_PORT:-8000}}
      NEXT_PUBLIC_FLOW_API_URL: ${LOCAL_NEXT_PUBLIC_FLOW_API_URL:-http://localhost:${FLOW_PORT:-8001}}
    depends_on:
      - backend
    ports:
      - "${PUBLISH_HOST:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  backend-logs:
  backend-uploads:
  browser-profiles:
  flow-models:
