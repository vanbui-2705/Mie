name: CD

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy, defaults to the selected branch"
        required: false
        type: string
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify build and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowmeta
          POSTGRES_PASSWORD: flowmeta_ci
          POSTGRES_DB: flowmeta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowmeta -d flowmeta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://flowmeta:flowmeta_ci@localhost:5432/flowmeta
    outputs:
      deploy_sha: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Upgrade PostgreSQL schema
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

      - name: Verify Alembic revision graph
        working-directory: backend
        run: python -m alembic heads

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Validate Docker Compose config
        env:
          # Placeholders only: `config` interpolates these but never connects anywhere.
          FERNET_KEY: ci-placeholder-fernet-key
          FLOWMETA_TOKEN_SECRET: ci-placeholder-token-secret
          KASM_VNC_PASSWORD: ci-placeholder-vnc-password
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Capture deploy revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    steps:
      - name: Prepare SSH key
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/flowmeta_prod_key
          chmod 600 ~/.ssh/flowmeta_prod_key
          ssh-keyscan -p "${PROD_SSH_PORT:-22}" "$PROD_HOST" >> ~/.ssh/known_hosts

      - name: Deploy with Docker Compose
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_PATH: ${{ secrets.PROD_PATH }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          DEPLOY_REF: ${{ needs.verify.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/flowmeta_prod_key -p "$PROD_SSH_PORT" "$PROD_USER@$PROD_HOST" \
            "cd '$PROD_PATH' && \
             git fetch --all --prune && \
             git checkout main && \
             git reset --hard '$DEPLOY_REF' && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d --remove-orphans && \
             docker compose -f docker-compose.yml -f docker-compose.prod.yml ps"

      - name: Smoke check
        shell: bash
        env:
          PROD_HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -n "${PROD_HEALTH_URL:-}" ]; then
            curl --fail --show-error --silent --retry 12 --retry-delay 5 "$PROD_HEALTH_URL"
          else
            echo "PROD_HEALTH_URL is not set; skipping smoke check."
          fi
