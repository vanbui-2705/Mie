name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowmeta
          POSTGRES_PASSWORD: flowmeta_ci
          POSTGRES_DB: flowmeta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowmeta -d flowmeta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://flowmeta:flowmeta_ci@localhost:5432/flowmeta
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Verify FastAPI app imports
        run: python -c "from app.main import app; print('Backend import OK')"

      - name: Verify Alembic revision graph
        run: python -m alembic heads

      - name: Upgrade PostgreSQL schema
        run: python -m alembic upgrade head

      - name: Run backend tests
        run: python -m pytest -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    env:
      # Placeholders only: `config` interpolates these but never connects anywhere.
      FERNET_KEY: ci-placeholder-fernet-key
      FLOWMETA_TOKEN_SECRET: ci-placeholder-token-secret
      KASM_VNC_PASSWORD: ci-placeholder-vnc-password
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
