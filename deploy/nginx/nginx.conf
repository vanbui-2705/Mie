worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Do not advertise the exact nginx build to the world.
    server_tokens off;

    sendfile   on;
    tcp_nopush on;
    keepalive_timeout 65;

    # A clip upload is measured in gigabytes over a home uplink: the default
    # 60s body timeout would kill it halfway.
    client_header_timeout 30s;
    client_body_timeout   600s;
    send_timeout          600s;

    # A <video> tag and an EventSource cannot set an Authorization header, so
    # /api/clips/*/stream and /api/events/stream carry the JWT in the query
    # string. Keep it out of the access log.
    map $request_uri $loggable_uri {
        ~^(?<path_only>[^?]*)\?(.*&)?token=  "$path_only?token=REDACTED";
        default                              $request_uri;
    }

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $loggable_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time ut=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Rate-limit keys. An empty key disables the limit for that request, which
    # is how POST-only limiting is expressed in nginx.
    map $request_method $clip_create_key {
        POST    $binary_remote_addr;
        default '';
    }

    limit_req_zone $binary_remote_addr zone=api:10m        rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m       rate=12r/m;
    limit_req_zone $clip_create_key    zone=clipcreate:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 16;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 16;
    }

    # Flow Studio is a separate process (backend/app/flow_app.py). Its port is
    # never published on the host — this proxy is the only way in.
    upstream flow_upstream {
        server flow:8001;
        keepalive 16;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # TLS server blocks live outside this file so the HTTP-only profile still
    # starts without certificates. Mount ./deploy/nginx/tls to /etc/nginx/tls.
    include /etc/nginx/tls/*.conf;

    server {
        listen 80;
        server_name _;

        # Keep in sync with CLIP_MAX_UPLOAD_BYTES (backend/app/config.py, 4 GB).
        client_max_body_size 4g;
        limit_conn perip 64;

        add_header X-Content-Type-Options    nosniff                        always;
        add_header X-Frame-Options           DENY                           always;
        add_header Referrer-Policy           strict-origin-when-cross-origin always;
        add_header Cross-Origin-Opener-Policy same-origin                   always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        # ---- Flow Studio -------------------------------------------------
        # /flow/* is stripped and forwarded to the Flow app, so the browser
        # talks to one origin only and Flow needs no CORS and no public port.
        # Buffering is off for the whole prefix: the SSE progress stream must
        # not be held back, and a rendered mp4 should stream straight through
        # instead of landing in a proxy temp file first.
        location = /flow/api/clip-jobs {
            limit_req zone=clipcreate burst=5 nodelay;
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://flow_upstream/api/clip-jobs;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 10s;
        }

        location /flow/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://flow_upstream/;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 10s;
            proxy_set_header Connection '';
        }

        # ---- Face API ----------------------------------------------------
        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            proxy_pass http://backend_upstream;
        }

        # Face's own SSE endpoint — same no-buffering rule as Flow's.
        location = /api/events/stream {
            proxy_pass http://backend_upstream;
            proxy_buffering off;
            gzip off;
            proxy_read_timeout 3600s;
            proxy_set_header Connection '';
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://backend_upstream;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location /docs {
            proxy_pass http://backend_upstream;
        }

        location /openapi.json {
            proxy_pass http://backend_upstream;
        }

        # Remote browser sessions are WebSocket (noVNC).
        location /remote/ {
            proxy_pass http://backend_upstream;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ---- Frontend ----------------------------------------------------
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 120s;
        }
    }
}
