services:
  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - frontend
      - backend
      - browser-worker
      - browserless
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    profiles: ["nginx"]
    depends_on:
      - frontend
      - backend
      - browser-worker
      - browserless
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
